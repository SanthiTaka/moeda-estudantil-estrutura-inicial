spring.application.name=moeda-estudantil
server.port=${PORT:8080}

# Banco local em arquivo. Para a primeira etapa, o Hibernate cria/atualiza tabelas.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/moeda-estudantil;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Notificacoes por email
# false = simulacao no terminal
# true = envio por SMTP configurado
app.email.enabled=false


# Email SMTP sera configurado quando implementarmos o envio.
# Nunca armazene credenciais reais neste arquivo ou no GitHub.
